<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCertAtlas — Pathways</title><style>body{font:15px system-ui;margin:0;background:#f6f7f9;color:#111827}main{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.panel,.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.panel{padding:14px;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}select,input,button{font:inherit;padding:9px 11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:14px}.done{opacity:.6}.node{border-left:4px solid #111827}.meta{color:#667085;font-size:13px}.edge{margin:6px 0;color:#667085}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><header class="top"><div><h1>OpenCertAtlas</h1><p class="meta">Prerequisite-first learning pathways based on the local progress state.</p></div><div class="controls"><select id="lang"><option>Русский</option><option selected>English</option><option>Українська</option><option>Deutsch</option><option>Español</option><option>Français</option></select><a href="index.html"><button>Catalogue</button></a><a href="progress.html"><button>Progress</button></a></div></header><section class="panel controls"><select id="track"></select><select id="target"><option value="all">All levels</option><option>Beginner</option><option>Foundation</option><option>Intermediate</option><option>Advanced</option><option>Professional</option><option>Expert</option><option>Master</option></select><button id="reset">Reset</button></section><section id="summary" class="panel meta"></section><section id="nodes" class="grid"></section></main><script>
let graph,rows=[],state={items:{}};const LEVELS=['Explore','Beginner','Foundation','Intermediate','Advanced','Professional','Expert','Master'];function load(){try{const x=JSON.parse(localStorage.getItem('oca-progress')||'{"version":1,"items":{}}');state=x.items?x:{version:1,items:x}}catch{state={items:{}}}}function done(id){return state.items[id]?.status==='completed'}function hasCredential(node){const terms=node.replaceAll('-',' ');return rows.filter(r=>(r['Certificate/Badge']+' '+r.Category+' '+r.Subcategory).toLowerCase().includes(terms.slice(0,12))).slice(0,3)}function render(){const t=document.getElementById('track').value||graph.tracks[0].id;const g=graph.tracks.find(x=>x.id===t)||graph.tracks[0],target=document.getElementById('target').value;const lv=graph.node_levels||{};const nodes=g.nodes.filter(n=>target==='all'||(lv[n]||'Discovery')===target);const completed=g.nodes.filter(done).length;document.getElementById('summary').textContent=`${g.name} · ${completed}/${g.nodes.length} nodes completed · prerequisite graph only; credential matching remains source-driven`;document.getElementById('nodes').innerHTML=nodes.map((n,i)=>{const prereq=g.edges.filter(e=>e[1]===n).map(e=>e[0]);const ready=prereq.every(done),d=done(n),matches=hasCredential(n);return `<article class="card node ${d?'done':''}"><div class="meta">${LEVELS.indexOf(lv[n]||'Discovery')>=0?lv[n]:'Discovery'} · ${ready?'Ready':'Prerequisites pending'}</div><h3>${n.replaceAll('-',' ')}</h3><div class="meta">Prerequisites: ${prereq.length?prereq.join(', '):'none'}</div>${matches.length?`<div class="edge">Possible catalog matches: ${matches.map(m=>m['Certificate/Badge']).join(' · ')}</div>`:''}<button onclick="mark('${n}')">${d?'Completed':'Mark complete'}</button></article>`}).join('')}function mark(id){state.items[id]={id,status:done(id)?'not_started':'completed',updated_at:new Date().toISOString()};localStorage.setItem('oca-progress',JSON.stringify(state));render()}function init(){load();Promise.all([fetch('../taxonomy/pathways.json').then(r=>r.json()),fetch('../data/catalog-expanded.json').then(r=>r.json())]).then(([g,d])=>{graph=g;rows=Array.isArray(d)?d:[];document.getElementById('track').innerHTML=graph.tracks.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');render()}).catch(()=>{document.getElementById('summary').textContent='Pathway data is unavailable offline until it has been cached.'})}document.getElementById('track').oninput=render;document.getElementById('target').oninput=render;document.getElementById('reset').onclick=()=>{document.getElementById('target').value='all';render()};document.addEventListener('DOMContentLoaded',init)
</script></body></html>
