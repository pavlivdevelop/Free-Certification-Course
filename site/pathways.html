<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCertAtlas — Pathways</title><style>body{font:15px system-ui;margin:0;background:#f6f7f9;color:#111827}main{max-width:1150px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.panel,.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px}.panel{padding:14px;margin:12px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}select,input,button{font:inherit;padding:9px 11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:14px}.done{opacity:.6}.node{border-left:4px solid #111827}.meta{color:#667085;font-size:13px}.edge{margin:6px 0;color:#667085}.candidate{margin-top:10px;padding:9px;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc}.candidate strong{display:block}.candidate small{color:#667085}.candidate a{display:inline-block;margin-top:5px}.disclaimer{margin-top:8px;padding:8px;border-radius:9px;background:#f8fafc;color:#667085;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><header class="top"><div><h1>OpenCertAtlas</h1><p class="meta">Prerequisite-first learning pathways based on the local progress state.</p></div><div class="controls"><select id="lang" aria-label="Language"></select><a href="index.html"><button type="button">Catalogue</button></a><a href="recommend.html"><button type="button">Recommendations</button></a><a href="progress.html"><button type="button">Progress</button></a></div></header><section class="panel controls"><select id="track" aria-label="Learning track"></select><select id="target" aria-label="Target level"><option value="all">All levels</option><option>Beginner</option><option>Foundation</option><option>Intermediate</option><option>Advanced</option><option>Professional</option><option>Expert</option><option>Master</option></select><button id="reset" type="button">Reset</button></section><section id="summary" class="panel meta"></section><section id="nodes" class="grid"></section></main><script>
const LANGS=[['ru','Русский'],['en','English'],['uk','Українська'],['de','Deutsch'],['es','Español'],['fr','Français'],['pt','Português'],['pl','Polski'],['tr','Türkçe'],['it','Italiano'],['nl','Nederlands'],['sv','Svenska'],['da','Dansk'],['no','Norsk'],['fi','Suomi'],['cs','Čeština'],['sk','Slovenčina'],['ro','Română'],['hu','Magyar'],['el','Ελληνικά'],['bg','Български'],['sr','Српски'],['hr','Hrvatski'],['sl','Slovenščina'],['vi','Tiếng Việt'],['id','Bahasa Indonesia'],['ms','Bahasa Melayu'],['th','ไทย'],['hi','हिन्दी'],['bn','বাংলা'],['ur','اردو'],['ar','العربية'],['fa','فارسی'],['he','עברית'],['zh','中文'],['ja','日本語'],['ko','한국어']];let graph,rows=[],mapping=[],state={};const lang=localStorage.getItem('oca-lang')||'en';function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){try{const x=JSON.parse(localStorage.getItem('oca-progress')||'{}');state=(x&&typeof x==='object'&&!Array.isArray(x))?x:{}}catch{state={}}}function done(id){return state[id]?.status==='done'}function hasCredential(node){const terms=node.replaceAll('-',' ');return rows.filter(r=>(r['Certificate/Badge']+' '+r.Category+' '+r.Subcategory).toLowerCase().includes(terms.slice(0,12))).slice(0,3)}function candidateCredentials(node){const ids=new Set(mapping.filter(m=>m.pathway_node===node&&m.mapping_status==='candidate').sort((a,b)=>(b.match_score||0)-(a.match_score||0)).slice(0,4).map(m=>String(m.credential_id)));return [...ids].map(id=>rows.find(r=>String(r.ID||'')===id)).filter(Boolean)}function render(){const t=document.getElementById('track').value||graph.tracks[0].id,g=graph.tracks.find(x=>x.id===t)||graph.tracks[0],target=document.getElementById('target').value,lv=graph.node_levels||{},nodes=g.nodes.filter(n=>target==='all'||(lv[n]||'Discovery')===target),completed=g.nodes.filter(done).length;document.getElementById('summary').textContent=`${g.name} · ${completed}/${g.nodes.length} nodes completed · prerequisite graph only; credential mapping is shown as non-authoritative candidate evidence`;document.getElementById('nodes').innerHTML=nodes.map(n=>{const prereq=g.edges.filter(e=>e[1]===n).map(e=>e[0]),ready=prereq.every(done),d=done(n),legacyMatches=hasCredential(n),candidates=candidateCredentials(n);return `<article class="card node ${d?'done':''}"><div class="meta">${esc(lv[n]||'Discovery')} · ${ready?'Ready':'Prerequisites pending'}</div><h3>${esc(n.replaceAll('-',' '))}</h3><div class="meta">Prerequisites: ${prereq.length?prereq.map(esc).join(', '):'none'}</div>${candidates.length?`<div class="edge"><strong>Candidate catalog matches</strong>${candidates.map(m=>`<div class="candidate"><strong>${esc(m['Certificate/Badge']||'Unnamed credential')}</strong><small>${esc(m.Organization||'')}${m.Category?' · '+esc(m.Category):''}</small>${m['Official URL']?`<a href="${esc(m['Official URL'])}" target="_blank" rel="noopener noreferrer">Official source</a>`:''}</div>`).join('')}<div class="disclaimer">Candidate mapping is a discovery signal only. It does not prove that the credential teaches this node or change verification/free status.</div></div>`:legacyMatches.length?`<div class="edge">Possible catalog matches: ${legacyMatches.map(m=>esc(m['Certificate/Badge'])).join(' · ')}</div>`:''}<button type="button" onclick="mark('${esc(n)}')">${d?'Completed':'Mark complete'}</button></article>`}).join('')}function mark(id){state[id]={status:done(id)?'not_started':'done',updated_at:new Date().toISOString()};localStorage.setItem('oca-progress',JSON.stringify(state));render()}function init(){const s=document.getElementById('lang');s.innerHTML=LANGS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');s.value=lang;document.documentElement.lang=lang;document.documentElement.dir=['ar','fa','he','ur'].includes(lang)?'rtl':'ltr';s.onchange=e=>{localStorage.setItem('oca-lang',e.target.value);document.documentElement.lang=e.target.value;document.documentElement.dir=['ar','fa','he','ur'].includes(e.target.value)?'rtl':'ltr'};load();Promise.all([fetch('data/pathways.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('pathways');return r.json()}),fetch('data/catalog-lite.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('catalog');return r.json()}),fetch('data/pathway-candidates-lite.json',{cache:'no-store'}).then(r=>r.ok?r.json():[]) ]).then(([g,d,m])=>{graph=g;rows=Array.isArray(d)?d:[];mapping=Array.isArray(m)?m:[];document.getElementById('track').innerHTML=graph.tracks.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');render()}).catch(()=>{document.getElementById('summary').textContent='Pathway data is unavailable.'})}document.getElementById('track').oninput=render;document.getElementById('target').oninput=render;document.getElementById('reset').onclick=()=>{document.getElementById('target').value='all';render()};document.addEventListener('DOMContentLoaded',init)
</script></body></html>
