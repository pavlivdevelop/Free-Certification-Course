<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenCertAtlas — Progress</title><style>body{font:15px system-ui;margin:0;background:#f6f7f9;color:#111827}header{padding:26px;background:#111827;color:#fff}main{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select,button{padding:9px;border:1px solid #d1d5db;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f3f4f6}.muted{color:#6b7280}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#111827;width:0}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}table{font-size:13px}th:nth-child(1),td:nth-child(1){display:none}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><header><main class="top"><div><h1 id="title">OpenCertAtlas — Progress</h1><p id="desc"></p></div><select id="lang" aria-label="Language"></select></main></header><main><div class="grid"><div class="card"><b id="lTotal"></b><h2 id="total">0</h2></div><div class="card"><b id="lDone"></b><h2 id="done">0</h2></div><div class="card"><b>XP</b><h2 id="xp">0</h2></div><div class="card"><b id="lLevel"></b><h2 id="level">Beginner</h2></div></div><div class="card" style="margin:12px 0"><div class="progress"><div class="bar" id="bar"></div></div><p id="pct" class="muted"></p></div><div class="controls"><input id="q"><select id="cat"><option value=""></option></select><select id="status"><option value=""></option><option value="not_started"></option><option value="in_progress"></option><option value="completed"></option><option value="skipped"></option></select><button id="exportBtn"></button><input type="file" id="import" accept="application/json" hidden><button id="importBtn" type="button"></button></div><div class="card"><table><thead><tr><th>ID</th><th id="lCredential"></th><th id="lCategory"></th><th id="lLevel"></th><th id="lStatus"></th><th id="lAction"></th></tr></thead><tbody id="body"></tbody></table></div></main><script>
const LANGS=[['ru','Русский'],['en','English'],['uk','Українська'],['de','Deutsch'],['es','Español'],['fr','Français'],['pt','Português'],['pl','Polski'],['tr','Türkçe'],['it','Italiano'],['nl','Nederlands'],['sv','Svenska'],['da','Dansk'],['no','Norsk'],['fi','Suomi'],['cs','Čeština'],['sk','Slovenčina'],['ro','Română'],['hu','Magyar'],['el','Ελληνικά'],['bg','Български'],['sr','Српски'],['hr','Hrvatski'],['sl','Slovenščina'],['vi','Tiếng Việt'],['id','Bahasa Indonesia'],['ms','Bahasa Melayu'],['th','ไทย'],['hi','हिन्दी'],['bn','বাংলা'],['ur','اردو'],['ar','العربية'],['fa','فارسی'],['he','עברית'],['zh','中文'],['ja','日本語'],['ko','한국어']];
const U={en:['Private browser-based progress tracker. Your progress stays on this device unless you export it.','Total','Completed','Level','Search','All categories','All statuses','Not started','In progress','Completed','Skipped','Export progress','Import progress','Credential / learning item','Category','Level','Status','Action','Done'],ru:['Приватный трекер прогресса. Данные остаются на этом устройстве, пока вы не экспортируете их.','Всего','Завершено','Уровень','Поиск','Все категории','Все статусы','Не начато','В процессе','Готово','Пропущено','Экспорт прогресса','Импорт прогресса','Сертификат / учебный материал','Категория','Уровень','Статус','Действие','Готово'],uk:['Приватний трекер прогресу. Дані залишаються на цьому пристрої, доки ви їх не експортуєте.','Усього','Завершено','Рівень','Пошук','Усі категорії','Усі статуси','Не розпочато','В процесі','Завершено','Пропущено','Експорт прогресу','Імпорт прогресу','Сертифікат / навчальний матеріал','Категорія','Рівень','Статус','Дія','Готово'],de:['Privater browserbasierter Fortschrittstracker. Der Fortschritt bleibt auf diesem Gerät, bis du ihn exportierst.','Gesamt','Abgeschlossen','Level','Suche','Alle Kategorien','Alle Status','Nicht begonnen','In Bearbeitung','Abgeschlossen','Übersprungen','Fortschritt exportieren','Fortschritt importieren','Credential / Lerninhalt','Kategorie','Level','Status','Aktion','Fertig']};
const F=U.en;let lang=localStorage.getItem('oca-lang')||'ru',rows=[],state={};const t=i=>(U[lang]||F)[i]||F[i];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{state=JSON.parse(localStorage.getItem('oca-progress')||'{"version":1,"items":{}}')}catch{state={version:1,items:{}}}state.items=state.items||{}}function save(){localStorage.setItem('oca-progress',JSON.stringify(state));render()}function xpFor(r){return({Discovery:5,Beginner:10,Foundation:15,Intermediate:25,Associate:25,Advanced:40,Professional:60,Expert:100}[r.Level]||10)}function setStatus(id,status){state.items[id]={...(state.items[id]||{}),id,status,updated_at:new Date().toISOString()};save()}
function apply(){document.documentElement.lang=lang;document.documentElement.dir=['ar','fa','he','ur'].includes(lang)?'rtl':'ltr';document.getElementById('desc').textContent=t(0);document.getElementById('lTotal').textContent=t(1);document.getElementById('lDone').textContent=t(2);document.getElementById('lLevel').textContent=t(3);document.getElementById('q').placeholder=t(4);document.getElementById('cat').firstElementChild.textContent=t(5);document.getElementById('status').firstElementChild.textContent=t(6);document.getElementById('status').querySelector('[value=not_started]').textContent=t(7);document.getElementById('status').querySelector('[value=in_progress]').textContent=t(8);document.getElementById('status').querySelector('[value=completed]').textContent=t(9);document.getElementById('status').querySelector('[value=skipped]').textContent=t(10);document.getElementById('exportBtn').textContent=t(11);document.getElementById('importBtn').textContent=t(12);['lCredential','lCategory','lLevel','lStatus','lAction'].forEach((id,i)=>document.getElementById(id).textContent=t(13+i));render()}
function render(){const q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value,s=document.getElementById('status').value;const out=rows.filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!c||r.Category===c)&&(!s||(state.items[r.ID]?.status||'not_started')===s)).slice(0,500);document.getElementById('body').innerHTML=out.map(r=>{const st=state.items[r.ID]?.status||'not_started';return `<tr><td>${esc(r.ID)}</td><td><b>${esc(r['Certificate/Badge'])}</b><div class=muted>${esc(r.Organization)} · <a href="${esc(r['Official URL']||'#')}" target="_blank" rel="noopener">↗</a></div></td><td><span class=pill>${esc(r.Category||'')}</span></td><td>${esc(r.Level||'')}</td><td><select onchange="setStatus('${esc(r.ID)}',this.value)"><option value=not_started ${st==='not_started'?'selected':''}>${t(7)}</option><option value=in_progress ${st==='in_progress'?'selected':''}>${t(8)}</option><option value=completed ${st==='completed'?'selected':''}>${t(9)}</option><option value=skipped ${st==='skipped'?'selected':''}>${t(10)}</option></select></td><td><button onclick="setStatus('${esc(r.ID)}','completed')">${t(18)}</button></td></tr>`}).join('');const done=Object.values(state.items).filter(v=>v.status==='completed').length;const x=Object.entries(state.items).reduce((s,[id,v])=>{const r=rows.find(a=>a.ID===id);return v.status==='completed'?s+xpFor(r||{}):s},0);document.getElementById('total').textContent=rows.length.toLocaleString();document.getElementById('done').textContent=done.toLocaleString();document.getElementById('xp').textContent=x.toLocaleString();document.getElementById('level').textContent=x<100?'Beginner':x<300?'Foundation':x<700?'Intermediate':x<1400?'Advanced':x<2500?'Professional':x<5000?'Expert':'Master';const p=rows.length?Math.round(done/rows.length*100):0;document.getElementById('bar').style.width=p+'%';document.getElementById('pct').textContent=p+'%'}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='opencertatlas-progress.json';a.click()}function init(){const sel=document.getElementById('lang');sel.innerHTML=LANGS.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');sel.value=lang;sel.onchange=e=>{lang=e.target.value;localStorage.setItem('oca-lang',lang);apply()};document.getElementById('exportBtn').onclick=exportData;document.getElementById('importBtn').onclick=()=>document.getElementById('import').click();document.getElementById('import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!d.items)throw new Error();state=d;save()}catch{alert('Invalid OpenCertAtlas progress file')}};r.readAsText(f)};['q','cat','status'].forEach(id=>document.getElementById(id).oninput=render);load();fetch('../data/catalog-expanded.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{rows=Array.isArray(j)?j:[];const cats=[...new Set(rows.map(r=>r.Category).filter(Boolean))].sort();document.getElementById('cat').innerHTML='<option value="">'+t(5)+'</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');apply()}).catch(()=>apply())}document.addEventListener('DOMContentLoaded',init);
</script></body></html>
