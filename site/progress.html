<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certification Progress</title><style>body{font:15px system-ui;margin:0;background:#f6f7f9;color:#111827}header{padding:28px;background:#111827;color:#fff}main{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select,button{padding:9px;border:1px solid #d1d5db;border-radius:8px;background:#fff}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f3f4f6}.muted{color:#6b7280}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2ff}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:#111827;width:0}</style></head><body><header><main><h1>Free Certification Roadmap — Progress</h1><p>Private browser-based tracker. Your progress stays in this browser unless you export it.</p></main></header><main><div class="grid"><div class="card"><b>Total</b><h2 id="total">—</h2></div><div class="card"><b>Completed</b><h2 id="done">0</h2></div><div class="card"><b>XP</b><h2 id="xp">0</h2></div><div class="card"><b>Level</b><h2 id="level">Beginner</h2></div></div><div class="card" style="margin:12px 0"><div class="progress"><div class="bar" id="bar"></div></div><p id="pct" class="muted"></p></div><div class="controls"><input id="q" placeholder="Search"><select id="cat"><option value="">All categories</option></select><select id="status"><option value="">All statuses</option><option value="not_started">Not started</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="skipped">Skipped</option></select><button onclick="exportData()">Export progress</button><label><input type="file" id="import" accept="application/json"> Import</label></div><div class="card"><table><thead><tr><th>ID</th><th>Credential / learning item</th><th>Category</th><th>Level</th><th>Status</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></main><script>let rows=[],state=JSON.parse(localStorage.getItem('fcc-progress')||'{"version":"1","items":{}}');function save(){localStorage.setItem('fcc-progress',JSON.stringify(state));renderStats()}function xpFor(r){return ({Beginner:10,Foundation:15,Intermediate:25,Advanced:40,Professional:60,Expert:100,Discovery:5}[r.Level]||10)}function renderStats(){let done=Object.values(state.items).filter(x=>x.status==='completed').length,xp=Object.entries(state.items).reduce((s,[id,x])=>x.status==='completed'?s+xpFor(rows.find(r=>r.ID===id)||{}):s,0),lvl=xp<100?'Beginner':xp<300?'Foundation':xp<700?'Intermediate':xp<1400?'Advanced':xp<2500?'Professional':'Expert';document.querySelector('#total').textContent=rows.length;document.querySelector('#done').textContent=done;document.querySelector('#xp').textContent=xp;document.querySelector('#level').textContent=lvl;let p=rows.length?Math.round(done/rows.length*100):0;document.querySelector('#bar').style.width=p+'%';document.querySelector('#pct').textContent=p+'% completed'}function parseCSV(t){let lines=t.trim().split(/\r?\n/),h=lines.shift().split(','),out=[];for(let line of lines){let a=[],cur='',q=false;for(let ch of line){if(ch==='"')q=!q;else if(ch===','&&!q){a.push(cur);cur=''}else cur+=ch}a.push(cur);let o={};h.forEach((k,i)=>o[k]=a[i]||'');out.push(o)}return out}function render(){let q=document.querySelector('#q').value.toLowerCase(),c=document.querySelector('#cat').value,s=document.querySelector('#status').value,out=rows.filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!c||r.Category===c)&&(!s||(state.items[r.ID]?.status||'not_started')===s)).slice(0,500);document.querySelector('#body').innerHTML=out.map(r=>{let st=state.items[r.ID]?.status||'not_started';return `<tr><td>${r.ID}</td><td><b>${r['Certificate/Badge']}</b><div class="muted">${r.Organization} · <a href="${r['Official URL']}" target="_blank">official</a></div></td><td><span class="pill">${r.Category}</span></td><td>${r.Level}</td><td><select onchange="setStatus('${r.ID}',this.value)"><option ${st==='not_started'?'selected':''} value="not_started">Not started</option><option ${st==='in_progress'?'selected':''} value="in_progress">In progress</option><option ${st==='completed'?'selected':''} value="completed">Completed</option><option ${st==='skipped'?'selected':''} value="skipped">Skipped</option></select></td><td><button onclick="setStatus('${r.ID}','completed')">✓ Done</button></td></tr>`}).join('');renderStats()}function setStatus(id,status){state.items[id]={...(state.items[id]||{}),status,completed_at:status==='completed'?new Date().toISOString():null};save();render()}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my-certification-progress.json';a.click()}document.querySelector('#import').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{state=JSON.parse(r.result);save();render()};r.readAsText(f)};fetch('../credentials/catalog-master.csv').then(r=>r.text()).then(t=>{rows=parseCSV(t);let cats=[...new Set(rows.map(r=>r.Category))].sort();document.querySelector('#cat').innerHTML='<option value="">All categories</option>'+cats.map(x=>`<option>${x}</option>`).join('');['q','cat','status'].forEach(id=>document.querySelector('#'+id).oninput=render);render()}).catch(()=>{document.querySelector('#body').innerHTML='<tr><td colspan="6">Catalogue not generated yet. Run the Generate catalogue workflow.</td></tr>'})</script></body></html>
