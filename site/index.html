<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Certification Course</title><meta name="description" content="Free-first credential directory with a personal learning roadmap."><style>:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--ok:#166534;--warn:#92400e;--soft:#f0f2f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.brand h1{margin:0;font-size:34px;letter-spacing:-.03em}.brand p{margin:8px 0;color:var(--muted);max-width:820px}.tools{display:flex;gap:8px;flex-wrap:wrap}select,input,button{font:inherit}select,input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}button{border:0;border-radius:10px;padding:10px 14px;background:#111827;color:#fff;cursor:pointer}button.secondary{background:#fff;color:#111827;border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:18px}.stat,.card,.progress,.filters,.path{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:15px}.stat b{display:block;font-size:21px;margin-top:3px}.stat small{color:var(--muted)}.progress{padding:16px;margin:18px 0}.row{display:flex;justify-content:space-between;gap:12px}.bar{height:10px;background:#eceff2;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:#111827}.filters{padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto auto;gap:10px;margin:18px 0}.section-title{font-size:20px;margin:22px 0 10px}.path{padding:14px}.pathgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.path button{background:#fff;color:#111827;border:1px solid var(--line);text-align:left}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:16px;display:flex;flex-direction:column;gap:8px}.tag{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--soft);margin-right:5px}.ok{background:#ecfdf3;color:var(--ok)}.warn{background:#fffbeb;color:var(--warn)}.meta{font-size:13px;color:var(--muted);line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.pathgrid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.wrap{padding:14px}.top{flex-direction:column}.grid,.cards,.filters,.pathgrid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><h1>Free Certification Course</h1><p id="subtitle">Каталог бесплатных и условно-бесплатных credentials, источников и личного roadmap. Прогресс хранится только в браузере.</p></div><div class="tools"><select id="lang"><option value="ru">Русский</option><option value="en">English</option><option value="uk">Українська</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="pl">Polski</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ar">العربية</option></select><button class="secondary" id="exportBtn">Экспорт</button><button class="secondary" id="importBtn">Импорт</button><input id="fileInput" type="file" accept="application/json" style="display:none"></div></div><div class="grid"><div class="stat"><small>Records</small><b id="total">—</b></div><div class="stat"><small>Free core</small><b id="free">—</b></div><div class="stat"><small>Credentials</small><b id="creds">—</b></div><div class="stat"><small>Sources</small><b id="sources">—</b></div><div class="stat"><small>Done</small><b id="done">0</b></div><div class="stat"><small>Rank</small><b id="rank">Explorer</b></div></div><div class="progress"><div class="row"><b>Personal roadmap</b><span class="meta" id="progressText">0%</span></div><div class="bar" style="margin-top:10px"><i id="bar"></i></div><div class="meta" style="margin-top:8px" id="nextText"></div></div><div class="section-title">Learning tracks</div><div class="path"><div class="pathgrid"><button data-cat="AI">🤖 AI / GenAI</button><button data-cat="Cybersecurity">🔐 Cybersecurity</button><button data-cat="Python">🐍 Python</button><button data-cat="Networking">📡 Networking</button><button data-cat="Cloud">☁️ Cloud</button><button data-cat="DevOps">⚙️ DevOps</button><button data-cat="Electronics">🔌 Electronics</button><button data-cat="Embedded">🧩 Embedded</button><button data-cat="Robotics">🤖 Robotics</button><button data-cat="Mathematics">🧮 Mathematics</button><button data-cat="Physics">⚛️ Physics</button><button data-cat="CAD">📐 CAD</button></div></div><div class="filters"><input id="q" placeholder="Поиск по названию, организации, теме…"><select id="category"><option value="">Категория</option></select><select id="price"><option value="">Цена</option><option value="free">✅ 0 ₽</option><option value="conditional">⚠️ условие</option><option value="paid">❌ paid/reference</option></select><select id="type"><option value="">Тип</option><option value="credential">Credential</option><option value="credential-reference">Reference</option><option value="source-watch">Source watch</option><option value="regional-source">Regional source</option><option value="language-watch">Language watch</option></select><select id="state"><option value="">Статус</option><option value="not_started">Не начато</option><option value="in_progress">В процессе</option><option value="done">Готово</option></select><button class="secondary" id="reset">Сбросить</button><button id="freeOnly">Только free</button></div><div id="list" class="cards"></div><div id="empty" class="empty" style="display:none">Ничего не найдено.</div></div><script>
const ranks=[['Explorer',0],['Foundation',150],['Builder',500],['Engineer',1200],['Specialist',2500],['Expert',5000]],CATS=['AI','Machine Learning','LLM','AI Agents','MLOps','Python','Java','C++','C#','JavaScript','Web','Mobile','APIs','Databases','Data Engineering','Data Analytics','Cybersecurity','Application Security','Security Operations','Digital Forensics','Cloud','Cloud Architecture','DevOps','SRE','Platform Engineering','Kubernetes','Containers','Networking','5G','6G','Telecommunications','IoT','Embedded','RISC-V','FPGA','ASIC','Electronics','PCB','EDA','RF','SDR','Antennas','Microwave','Signal Processing','DSP','Control Systems','Robotics','ROS','PLC','SCADA','Industrial Automation','Mechatronics','CAD','BIM','CAE','CFD','FEA','Digital Twins','CNC','3D Printing','Metrology','Semiconductors','Materials Science','Physics','Mathematics','Statistics','Quantum Computing','GIS','Remote Sensing','Aerospace','Automotive','Energy','Renewables','Power Systems','Medical Devices','Biotechnology','Chemistry','Environmental Technology','Agricultural Technology','Technical Writing','Project Management','Product Management','UX Engineering','Accessibility','Open Source','Software Supply Chain','Observability','Testing','QA Automation','Game Development','XR','Blockchain','HealthTech','EdTech','Maritime Technology','Rail Technology','Smart Cities','Cyber-Physical Systems'];let all=[],state={};
const T={ru:{s:'Каталог бесплатных и условно-бесплатных credentials, источников и личного roadmap. Прогресс хранится только в браузере.',complete:'Отметить готовым',undo:'Вернуть',details:'Официальная страница',not:'Не начато',prog:'В процессе',done:'Готово',search:'Поиск по названию, организации, теме…',cat:'Категория'},en:{s:'Free-first credential and source directory with a personal roadmap. Progress is stored locally.',complete:'Mark complete',undo:'Undo',details:'Official page',not:'Not started',prog:'In progress',done:'Completed',search:'Search title, provider, topic…',cat:'Category'},uk:{s:'Каталог безкоштовних та умовно-безкоштовних credentials, джерел та особистого roadmap. Прогрес локальний.',complete:'Завершити',undo:'Повернути',details:'Офіційна сторінка',not:'Не розпочато',prog:'В процесі',done:'Готово',search:'Пошук…',cat:'Категорія'}};
function tr(k){const l=document.getElementById('lang').value;return(T[l]||T.en)[k]||(T.en)[k]||k}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(){try{state=JSON.parse(localStorage.getItem('fcc-progress')||'{}')}catch{state={}}}function save(){localStorage.setItem('fcc-progress',JSON.stringify(state));render()}function xp(){return Object.values(state).reduce((n,v)=>n+(v==='done'?100:v==='in_progress'?5:0),0)}function getRank(){let x=xp(),r='Explorer';for(const[n,m]of ranks)if(x>=m)r=n;return r}function setStatus(id,s){state[id]=s;save()}
function parseCSV(line){const o=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){c+='"';i++}else q=!q}else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}function csv(text){const l=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean),h=parseCSV(l[0]);return l.slice(1).map(x=>Object.fromEntries(h.map((k,i)=>[k,parseCSV(x)[i]||''])))}
function generate(providers,seed){const rows=seed.map(r=>({...r,'Record Type':r['Record Type']||'credential','Completion Status':r['Completion Status']||'Не начато'}));const seen=new Set(rows.map(r=>r.ID));const pairs=[];for(const p of providers){for(const c of CATS)pairs.push([p.organization,p.country,c,p.official_url])}pairs.sort((a,b)=>(a[0]+'|'+a[2]).localeCompare(b[0]+'|'+b[2]));for(const[org,country,c,url]of pairs.slice(0,1750)){const id='SRCX-'+btoa(unescape(encodeURIComponent(org+'|'+c))).replace(/[^a-zA-Z0-9]/g,'').slice(0,12);if(seen.has(id))continue;rows.push({ID:id,Country:country,Organization:org,'Certificate/Badge':org+' — '+c+' source & credential directory','Record Type':'source-watch',Category:c,Subcategory:c,Level:'catalog','Price Status':'⚠️ verify current offer',Conditions:'Monitoring record. Verify current official credential/course and price before calling it free.','Exam/Assessment':'Varies',Duration:'Varies',Language:'Provider-dependent','Available from Russia':'Unknown',Validity:'Varies','Credly/Verification':'Provider-dependent',LinkedIn:'Varies','Official URL':url,Priority:'C','Completion Status':'Не начато','Evidence Status':'Source watch — auto review','Last Reviewed':'2026-08-31','Next Review':'2026-11-29',Confidence:'discovery','Source Type':'provider × domain watch'});seen.add(id)}for(const[p]of providers.entries()){if(p>0&&p%8===0){} }return rows}
function filtered(){const q=document.getElementById('q').value.trim().toLowerCase(),c=document.getElementById('category').value,p=document.getElementById('price').value,ty=document.getElementById('type').value,s=document.getElementById('state').value;return all.filter(r=>{const st=state[r.ID]||'';return(!q||[r['Certificate/Badge'],r.Organization,r.Category,r.Subcategory].join(' ').toLowerCase().includes(q))&&(!c||r.Category===c)&&(!ty||r['Record Type']===ty)&&(!p||(p==='free'?String(r['Price Status']).startsWith('✅'):p==='conditional'?String(r['Price Status']).includes('⚠️'):String(r['Price Status']).startsWith('❌')))&&(!s||(s==='not_started'?!st:s==='in_progress'?st==='in_progress':st==='done'))})}
function render(){const list=filtered(),shown=list.slice(0,180);document.getElementById('list').innerHTML=shown.map(r=>{const s=state[r.ID]||'not_started',done=s==='done',warn=String(r['Price Status']).includes('⚠️');return `<article class="card"><div><span class="tag">${esc(r.Category||'')}</span><span class="tag ${warn?'warn':'ok'}">${esc(r['Price Status']||'')}</span><span class="tag">${esc(r['Record Type']||'')}</span></div><h3>${esc(r['Certificate/Badge'])}</h3><div class="meta"><b>${esc(r.Organization)}</b> · ${esc(r.Country)}<br>${esc(r.Subcategory||'')} · ${esc(r.Level||'')}<br>${esc(r.Language||'')}</div><div class="actions"><button onclick="setStatus('${esc(r.ID)}','${done?'not_started':'done'}')">${done?tr('undo'):tr('complete')}</button>${s!=='done'?`<button class="secondary" onclick="setStatus('${esc(r.ID)}','in_progress')">▶ ${tr('prog')}</button>`:''}<a class="secondary" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none" target="_blank" rel="noopener" href="${esc(r['Official URL'])}">${tr('details')}</a></div><div class="meta">${s==='done'?tr('done'):s==='in_progress'?tr('prog'):tr('not')}</div></article>`}).join('');document.getElementById('empty').style.display=list.length?'none':'block';const total=all.length,free=all.filter(r=>String(r['Price Status']).startsWith('✅')).length,creds=all.filter(r=>['credential','credential-reference'].includes(r['Record Type'])).length,sources=all.length-creds,done=Object.values(state).filter(v=>v==='done').length,xx=xp(),pct=total?Math.round(done/total*100):0;['total','free','creds','sources','done'].forEach((id,i)=>document.getElementById(id).textContent=[total,free,creds,sources,done][i]);document.getElementById('rank').textContent=getRank();document.getElementById('progressText').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';document.getElementById('nextText').textContent=xx+' XP · '+getRank()}
async function boot(){load();let seed=[];try{const r=await fetch('../data/catalog-expanded.json');if(r.ok)all=await r.json()}catch{}if(!all.length){try{const[r1,r2]=await Promise.all([fetch('../data/providers/providers.csv').catch(()=>null),fetch('../data/catalog-01.csv').catch(()=>null)]);if(r1&&r2&&r1.ok&&r2.ok){const providers=csv(await r1.text()),seed0=csv(await r2.text());const grouped=providers.map(p=>({organization:p.organization,country:p.country,official_url:p.official_url}));all=generate(grouped,seed0)}}catch{}}initFilters();render()}
function initFilters(){document.getElementById('category').innerHTML='<option value="">'+tr('cat')+'</option>'+[...new Set(all.map(r=>r.Category).filter(Boolean))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}
for(const id of ['q','category','price','type','state'])document.getElementById(id).addEventListener('input',render);document.getElementById('reset').onclick=()=>{['q','category','price','type','state'].forEach(id=>document.getElementById(id).value='');render()};document.getElementById('freeOnly').onclick=()=>{document.getElementById('price').value='free';render()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.getElementById('category').value=b.dataset.cat;document.getElementById('price').value='free';render()});document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fcc-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{state=JSON.parse(rd.result);save()}catch{alert('Invalid progress file')}};rd.readAsText(f)};document.getElementById('lang').onchange=()=>{document.getElementById('subtitle').textContent=tr('s');document.getElementById('q').placeholder=tr('search');initFilters();render()};boot();
</script></body></html>
