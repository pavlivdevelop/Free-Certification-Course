<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Certification Course</title>
<meta name="description" content="Free-first directory of certificates, digital badges and technical credentials with a personal learning roadmap.">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#667085;--line:#e5e7eb;--accent:#111827;--ok:#166534;--warn:#92400e;--soft:#f0f2f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.brand h1{margin:0;font-size:34px;letter-spacing:-.03em}.brand p{margin:8px 0 0;color:var(--muted);max-width:780px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input,button{font:inherit}select,input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer}button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.stat,.card,.progress,.filters,.path{background:var(--card);border:1px solid var(--line);border-radius:14px}.stat{padding:16px}.stat b{display:block;font-size:22px;margin-top:3px}.stat small{color:var(--muted)}
.progress{padding:16px;margin:18px 0}.bar{height:10px;background:#eceff2;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:#111827}.progressrow{display:flex;justify-content:space-between;gap:12px}.filters{padding:14px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto auto;gap:10px;margin:18px 0}.section-title{margin:24px 0 10px;font-size:20px}.path{padding:14px;margin-bottom:18px}.pathgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.path button{width:100%;text-align:left;background:#fff;color:var(--text);border:1px solid var(--line)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{padding:16px;display:flex;flex-direction:column;gap:8px}.tag{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--soft);margin-right:5px}.tag.ok{background:#ecfdf3;color:var(--ok)}.tag.warn{background:#fffbeb;color:var(--warn)}.card h3{font-size:17px;margin:0}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}.meta{font-size:13px;color:var(--muted);line-height:1.5}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.pathgrid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.wrap{padding:14px}.top{flex-direction:column}.grid,.cards,.filters,.pathgrid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand"><h1>Free Certification Course</h1><p id="subtitle">Каталог бесплатных и условно-бесплатных credentials с личным roadmap. Состояние обучения хранится только в браузере.</p></div><div class="tools"><select id="lang"><option value="ru">Русский</option><option value="en">English</option><option value="uk">Українська</option><option value="de">Deutsch</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option><option value="pl">Polski</option><option value="zh">中文</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="ar">العربية</option></select><button class="secondary" id="exportBtn">Экспорт прогресса</button><button class="secondary" id="importBtn">Импорт</button><input id="fileInput" type="file" accept="application/json" style="display:none"></div></div>
<div class="grid"><div class="stat"><small>Записей</small><b id="total">—</b></div><div class="stat"><small>Free core</small><b id="free">—</b></div><div class="stat"><small>Завершено</small><b id="done">0</b></div><div class="stat"><small>XP</small><b id="xp">0</b></div><div class="stat"><small>Ранг</small><b id="rank">Explorer</b></div></div>
<div class="progress"><div class="progressrow"><b>Личный прогресс</b><span class="muted" id="progressText">0%</span></div><div class="bar" style="margin-top:10px"><i id="bar"></i></div><div class="meta" style="margin-top:8px" id="nextText"></div></div>
<div class="section-title">Рекомендуемые треки</div><div class="path"><div class="pathgrid"><button data-cat="AI">🤖 AI / GenAI</button><button data-cat="Cybersecurity">🔐 Cybersecurity</button><button data-cat="Python">🐍 Python</button><button data-cat="Networking">📡 Networking</button><button data-cat="Cloud">☁️ Cloud</button><button data-cat="DevOps">⚙️ DevOps</button><button data-cat="Electronics">🔌 Electronics</button><button data-cat="Embedded">🧩 Embedded</button><button data-cat="Robotics">🤖 Robotics</button><button data-cat="Mathematics">🧮 Mathematics</button><button data-cat="Physics">⚛️ Physics</button><button data-cat="CAD">📐 CAD</button></div></div>
<div class="filters"><input id="q" placeholder="Поиск по названию, организации, теме…"><select id="category"><option value="">Категория</option></select><select id="price"><option value="">Цена</option><option value="free">✅ 0 ₽</option><option value="conditional">⚠️ условие</option><option value="paid">❌ paid/reference</option></select><select id="type"><option value="">Тип</option><option value="credential">Credential</option><option value="credential-reference">Reference</option><option value="source-watch">Source watch</option><option value="regional-source">Regional source</option><option value="language-watch">Language watch</option></select><select id="state"><option value="">Статус</option><option value="not_started">Не начато</option><option value="in_progress">В процессе</option><option value="done">Готово</option></select><button class="secondary" id="reset">Сбросить</button><button id="freeOnly">Только free</button></div>
<div id="list" class="cards"></div><div id="empty" class="empty" style="display:none">Ничего не найдено.</div>
</div>
<script>
const ranks=[['Explorer',0],['Foundation',150],['Builder',500],['Engineer',1200],['Specialist',2500],['Expert',5000]];let all=[],state={};
const t={ru:{subtitle:'Каталог бесплатных и условно-бесплатных credentials с личным roadmap. Состояние обучения хранится только в браузере.',complete:'Отметить готовым',undo:'Вернуть',details:'Официальная страница',notstarted:'Не начато',inprogress:'В процессе',completed:'Готово',cat:'Категория',search:'Поиск по названию, организации, теме…'},en:{subtitle:'Free-first credential directory with a personal roadmap. Progress is stored locally in your browser.',complete:'Mark complete',undo:'Undo',details:'Official page',notstarted:'Not started',inprogress:'In progress',completed:'Completed',cat:'Category',search:'Search title, provider, topic…'},uk:{subtitle:'Каталог безкоштовних та умовно-безкоштовних credentials з особистим roadmap. Прогрес зберігається локально.',complete:'Завершити',undo:'Повернути',details:'Офіційна сторінка',notstarted:'Не розпочато',inprogress:'В процесі',completed:'Готово',cat:'Категорія',search:'Пошук…'}};
function tr(k){const l=document.getElementById('lang').value;return (t[l]||t.en)[k]||(t.en)[k]||k}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{state=JSON.parse(localStorage.getItem('fcc-progress')||'{}')}catch{state={}}}
function save(){localStorage.setItem('fcc-progress',JSON.stringify(state));render()}
function xp(){return Object.values(state).reduce((n,v)=>n+(v==='done'?100:v==='in_progress'?5:0),0)}
function getRank(){let x=xp(),r=ranks[0][0];for(const [n,m] of ranks)if(x>=m)r=n;return r}
function setStatus(id,s){state[id]=s;save()}
function categories(){return [...new Set(all.map(r=>r.Category).filter(Boolean))].sort()}
function initFilters(){document.getElementById('category').innerHTML='<option value="">'+tr('cat')+'</option>'+categories().map(c=>`<option>${esc(c)}</option>`).join('')}
function filtered(){const q=document.getElementById('q').value.trim().toLowerCase(),c=document.getElementById('category').value,p=document.getElementById('price').value,ty=document.getElementById('type').value,s=document.getElementById('state').value;return all.filter(r=>{const st=state[r.ID]||'';return(!q||[r['Certificate/Badge'],r.Organization,r.Category,r.Subcategory].join(' ').toLowerCase().includes(q))&&(!c||r.Category===c)&&(!ty||r['Record Type']===ty)&&(!p||(p==='free'?String(r['Price Status']).startsWith('✅'):p==='conditional'?String(r['Price Status']).includes('⚠️'):String(r['Price Status']).startsWith('❌')))&&(!s||(s==='not_started'?!st:s==='in_progress'?st==='in_progress':st==='done'))})}
function render(){const list=filtered(),shown=list.slice(0,180);document.getElementById('list').innerHTML=shown.map(r=>{const s=state[r.ID]||'not_started',done=s==='done',warn=String(r['Price Status']).includes('⚠️');return `<article class="card"><div><span class="tag">${esc(r.Category||'')}</span><span class="tag ${warn?'warn':'ok'}">${esc(r['Price Status']||'')}</span><span class="tag">${esc(r['Record Type']||'')}</span></div><h3>${esc(r['Certificate/Badge'])}</h3><div class="meta"><b>${esc(r.Organization)}</b> · ${esc(r.Country)}<br>${esc(r.Subcategory||'')} · ${esc(r.Level||'')}<br>${esc(r.Language||'')}</div><div class="actions"><button onclick="setStatus('${esc(r.ID)}','${done?'not_started':'done'}')">${done?tr('undo'):tr('complete')}</button>${s!=='done'?`<button class="secondary" onclick="setStatus('${esc(r.ID)}','in_progress')">▶ ${tr('inprogress')}</button>`:''}<a class="secondary" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none" target="_blank" rel="noopener" href="${esc(r['Official URL'])}">${tr('details')}</a></div><div class="meta">${s==='done'?tr('completed'):s==='in_progress'?tr('inprogress'):tr('notstarted')}</div></article>`}).join('');document.getElementById('empty').style.display=list.length?'none':'block';const total=all.length,free=all.filter(r=>String(r['Price Status']).startsWith('✅')).length,done=Object.values(state).filter(v=>v==='done').length,xx=xp(),pct=total?Math.round(done/total*100):0;document.getElementById('total').textContent=total;document.getElementById('free').textContent=free;document.getElementById('done').textContent=done;document.getElementById('xp').textContent=xx;document.getElementById('rank').textContent=getRank();document.getElementById('progressText').textContent=pct+'%';document.getElementById('bar').style.width=pct+'%';document.getElementById('nextText').textContent=`${xx} XP · ${getRank()}`}
async function boot(){load();let res=await fetch('../data/catalog-expanded.json').catch(()=>null);if(res&&res.ok)all=await res.json();else{const rr=await fetch('../data/catalog-01.csv');all=csv(await rr.text())}initFilters();render()}
function csv(text){const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);const h=parseCSV(lines[0]);return lines.slice(1).map(l=>{const x=parseCSV(l);return Object.fromEntries(h.map((k,i)=>[k,x[i]||'']))})}
function parseCSV(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
for(const id of ['q','category','price','type','state'])document.getElementById(id).addEventListener('input',render);document.getElementById('reset').onclick=()=>{['q','category','price','type','state'].forEach(id=>document.getElementById(id).value='');render()};document.getElementById('freeOnly').onclick=()=>{document.getElementById('price').value='free';render()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{document.getElementById('category').value=b.dataset.cat;document.getElementById('price').value='free';render()});document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fcc-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{state=JSON.parse(reader.result);save()}catch{alert('Invalid progress file')}};reader.readAsText(f)};document.getElementById('lang').onchange=()=>{document.documentElement.lang=document.getElementById('lang').value;document.getElementById('subtitle').textContent=tr('subtitle');document.getElementById('q').placeholder=tr('search');initFilters();render()};boot();
</script></body></html>
