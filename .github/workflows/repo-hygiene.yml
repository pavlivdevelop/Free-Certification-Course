name: Repository hygiene

on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - 'scripts/**'
      - 'status/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'site/**'
      - 'scripts/**'
      - 'status/**'
      - '.github/workflows/**'
  workflow_run:
    workflows: ['Build official catalog','Source health']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene
  cancel-in-progress: true

jobs:
  hygiene:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run repository hygiene checks
        run: python scripts/check_repo_hygiene.py
      - name: Validate operational payload contracts
        run: python scripts/validate_operational_payloads.py
      - name: Validate release artifacts when present
        run: python scripts/validate_release_artifacts.py
      - name: Validate deterministic promotion preview when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f data/catalog-expanded.csv ] && [ -f status/promotion-preview.md ]; then
            cp status/promotion-preview.md /tmp/promotion-preview.md
            python scripts/promotion_preview.py
            cmp -s /tmp/promotion-preview.md status/promotion-preview.md
            test "$(grep -c '^|' status/promotion-preview.md)" -le 502
            grep -q 'This report is advisory only' status/promotion-preview.md
            grep -q 'never changes catalog records' status/promotion-preview.md
          else
            echo 'promotion_preview=not_present'
          fi
