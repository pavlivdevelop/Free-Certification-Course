name: Deploy OpenCertAtlas site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'status/review-queue-lite.json'
      - 'status/source-health.json'
      - 'status/release-manifest.json'
      - 'status/release-index.json'
      - 'status/REVIEW-QUEUE.csv'
      - 'status/SOURCE-HEALTH.md'
      - 'status/CREDENTIAL-PATHWAY-CANDIDATES.csv'
      - 'data/pathway-candidates-lite.json'
      - 'taxonomy/pathways.json'
      - 'data/catalog-expanded.json'
      - 'data/catalog-lite.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_run:
    workflows: ['Build official catalog','Source health']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages_state.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Detect GitHub Pages availability
        id: pages_state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "200" ]; then echo 'enabled=true' >> "$GITHUB_OUTPUT"; else echo 'enabled=false' >> "$GITHUB_OUTPUT"; echo "GitHub Pages is not configured (HTTP $code); build will be validated and deployment skipped."; fi
      - name: Setup Pages
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data _site/status
          cp -R site/. _site/
          cp data/catalog-expanded.json _site/data/catalog-expanded.json
          cp data/catalog-lite.json _site/data/catalog-lite.json
          cp taxonomy/pathways.json _site/data/pathways.json
          cp status/review-queue-lite.json _site/status/review-queue-lite.json
          cp status/source-health.json _site/status/source-health.json
          cp status/release-manifest.json _site/status/release-manifest.json
          if [ -f status/release-index.json ]; then cp status/release-index.json _site/status/release-index.json; fi
          if [ -f status/REVIEW-QUEUE.csv ]; then cp status/REVIEW-QUEUE.csv _site/status/REVIEW-QUEUE.csv; fi
          if [ -f status/SOURCE-HEALTH.md ]; then cp status/SOURCE-HEALTH.md _site/status/SOURCE-HEALTH.md; fi
          if [ -f data/pathway-candidates-lite.json ]; then cp data/pathway-candidates-lite.json _site/data/pathway-candidates-lite.json; fi
          if [ -f status/CREDENTIAL-PATHWAY-CANDIDATES.csv ]; then cp status/CREDENTIAL-PATHWAY-CANDIDATES.csv _site/status/CREDENTIAL-PATHWAY-CANDIDATES.csv; fi
      - name: Validate assembled site
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html progress.html recommend.html pathways.html release.html releases.html review.html sources.html; do test -s "_site/$page"; done
          for asset in status/review-queue-lite.json status/source-health.json status/release-manifest.json data/catalog-expanded.json data/catalog-lite.json data/pathways.json manifest.webmanifest sw.js; do test -s "_site/$asset"; done
          if [ -f status/REVIEW-QUEUE.csv ]; then test -s _site/status/REVIEW-QUEUE.csv; fi
          if [ -f status/SOURCE-HEALTH.md ]; then test -s _site/status/SOURCE-HEALTH.md; fi
          if [ -f _site/status/release-index.json ]; then test -s _site/status/release-index.json; fi
          if [ -f _site/data/pathway-candidates-lite.json ]; then test -s _site/data/pathway-candidates-lite.json; fi
          if [ -f _site/status/CREDENTIAL-PATHWAY-CANDIDATES.csv ]; then test -s _site/status/CREDENTIAL-PATHWAY-CANDIDATES.csv; fi
      - name: Upload Pages artifact
        if: steps.pages_state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Upload build artifact when Pages is unavailable
        if: steps.pages_state.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencertatlas-site-build
          path: _site
          if-no-files-found: error
  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify live GitHub Pages site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          base="${PAGE_URL%/}"
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "$base/" -o /tmp/opencertatlas-home.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "$base/release.html" -o /tmp/opencertatlas-release.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "$base/releases.html" -o /tmp/opencertatlas-releases.html
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors "$base/pathways.html" -o /tmp/opencertatlas-pathways.html
          grep -q "OpenCertAtlas" /tmp/opencertatlas-home.html
          grep -q "Reproducible release" /tmp/opencertatlas-release.html
          grep -q "Immutable catalog release history" /tmp/opencertatlas-releases.html
          grep -q "Candidate catalog matches" /tmp/opencertatlas-pathways.html
          if curl -fsSL --retry 3 --retry-delay 3 --retry-all-errors "$base/status/release-index.json" -o /tmp/opencertatlas-release-index.json; then grep -q '"snapshot_count"' /tmp/opencertatlas-release-index.json; else echo 'release_index_live=not_yet_available'; fi
          echo "live_pages_check=passed url=$PAGE_URL"
