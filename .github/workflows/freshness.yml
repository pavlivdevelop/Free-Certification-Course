name: Credential freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'
  push:
    paths:
      - 'data/catalog-expanded.csv'
      - 'data/catalog-expanded.json'
      - 'providers/**'
      - 'scripts/check_freshness.py'
      - '.github/workflows/freshness.yml'

concurrency:
  group: credential-freshness
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check catalog freshness
        run: python scripts/check_freshness.py
      - name: Publish report safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/freshness-report.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(status): refresh credential freshness report [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:main
