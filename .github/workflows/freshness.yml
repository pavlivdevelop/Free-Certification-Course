name: Credential freshness

on:
  push:
    paths:
      - 'data/catalog-expanded.csv'
      - 'data/catalog-expanded.json'
      - 'providers/**'
      - 'scripts/check_freshness.py'
      - '.github/workflows/freshness.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check catalog freshness
        run: python scripts/check_freshness.py
      - name: Commit report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/freshness-report.json
          git diff --cached --quiet || git commit -m "chore: refresh credential freshness report [skip ci]"
          git push
