name: Evidence source capture

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 2'
  workflow_run:
    workflows: ['Promotion preview']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: opencertatlas-evidence-source-capture
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test source-capture network policy
        run: python -m unittest tests/test_evidence_source_capture_policy.py -v
      - name: Capture bounded issuer metadata
        run: python scripts/capture_evidence_sources.py
      - name: Validate source-capture contract
        run: python scripts/validate_evidence_source_capture.py
      - name: Summarize source-capture results
        run: python scripts/summarize_evidence_source_capture.py
      - name: Upload source-capture artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencertatlas-evidence-source-capture
          path: |
            status/evidence-source-capture.json
            status/evidence-source-capture-summary.md
          if-no-files-found: error
