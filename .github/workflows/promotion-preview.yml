name: Promotion preview

on:
  workflow_dispatch:
  schedule:
    - cron: '31 4 * * 1'
  push:
    paths:
      - 'data/catalog-expanded.csv'
      - 'scripts/promotion_preview.py'
      - 'scripts/validate_promotion_preview.py'
      - 'scripts/build_evidence_packets.py'
      - 'scripts/validate_evidence_packets.py'
      - 'evidence/PROMOTION-RULES.md'
      - 'evidence/EVIDENCE-PACKETS.md'
      - '.github/workflows/promotion-preview.yml'

permissions:
  contents: read

concurrency:
  group: opencertatlas-promotion-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build advisory promotion preview
        run: python scripts/promotion_preview.py
      - name: Validate advisory promotion preview
        run: python scripts/validate_promotion_preview.py
      - name: Build manual evidence packets
        run: python scripts/build_evidence_packets.py
      - name: Validate manual evidence packets
        run: python scripts/validate_evidence_packets.py
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: opencertatlas-promotion-review-package
          path: |
            status/promotion-preview.md
            status/promotion-preview.json
            status/evidence-packet-index.json
            status/EVIDENCE-PACKETS-SUMMARY.md
          if-no-files-found: error
