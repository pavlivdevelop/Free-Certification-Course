name: Build official catalog

on:
  push:
    paths:
      - 'providers/**'
      - 'taxonomy/**'
      - 'data/catalog-*.csv'
      - 'scripts/extract_official_credentials.py'
      - 'scripts/build_official_catalog.py'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Extract concrete names from issuer pages
        run: python scripts/extract_official_credentials.py
      - name: Build canonical dataset
        run: python scripts/build_official_catalog.py
      - name: Validate dataset
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data/catalog-expanded.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig')))
          assert len(rows) >= 5000, f'Expected >=5000 records, got {len(rows)}'
          assert all(r['ID'] and r['Organization'] and r['Certificate/Badge'] for r in rows)
          names={(r['Organization'].lower(),r['Certificate/Badge'].lower(),r['Official URL']) for r in rows}
          assert len(names)==len(rows), 'duplicate records detected'
          candidates=sum(r['Record Type']=='credential-candidate' for r in rows)
          print(f'records={len(rows)} candidates={candidates}')
          PY
      - name: Commit generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add credentials/extracted-candidates.jsonl evidence/extraction-evidence.jsonl data/catalog-expanded.csv data/catalog-expanded.json data/free-core.csv data/conditional.csv status/CATALOG-STATS.md
          git diff --cached --quiet || git commit -m 'chore(data): refresh official credential catalog [skip ci]'
          git push
