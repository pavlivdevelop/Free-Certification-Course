name: Build official catalog

on:
  # Generated commits are followed by workflow_run consumers; seed/source edits start the build here.
  push:
    paths:
      - 'providers/**'
      - 'taxonomy/**'
      - 'data/catalog-[0-9]*.csv'
      - 'scripts/extract_official_credentials.py'
      - 'scripts/build_official_catalog.py'
      - 'scripts/validate_catalog.py'
      - 'scripts/build_light_payload.py'
      - 'scripts/build_review_queue.py'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: free-certification-catalog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Extract concrete names from issuer pages
        run: python scripts/extract_official_credentials.py
      - name: Build canonical dataset
        run: python scripts/build_official_catalog.py
      - name: Validate canonical dataset
        run: python scripts/validate_catalog.py
      - name: Build lightweight browser payload
        run: python scripts/build_light_payload.py
      - name: Build deterministic review queue
        run: python scripts/build_review_queue.py
      - name: Publish generated data safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add credentials/extracted-candidates.jsonl evidence/extraction-evidence.jsonl data/catalog-expanded.csv data/catalog-expanded.json data/free-core.csv data/conditional.csv data/catalog-lite.json status/CATALOG-STATS.md status/REVIEW-QUEUE.csv
          git diff --cached --quiet && exit 0
          git commit -m 'chore(data): refresh official credential catalog'
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:main