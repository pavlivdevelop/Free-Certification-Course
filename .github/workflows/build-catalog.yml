name: Build expanded catalog

on:
  push:
    paths:
      - 'providers/**'
      - 'data/catalog-01.csv'
      - 'scripts/build_catalog.py'
      - '.github/workflows/build-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate catalog
        run: python scripts/build_catalog.py
      - name: Commit generated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/catalog-expanded.csv data/catalog-expanded.json data/free-core.csv data/conditional.csv
          git diff --cached --quiet || git commit -m "chore: rebuild expanded catalog [skip ci]"
          git push
