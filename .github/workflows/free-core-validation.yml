name: Free-core validation

on:
  push:
    paths:
      - 'data/free-core.csv'
      - 'scripts/validate_free_core.py'
      - 'evidence/**'
      - '.github/workflows/free-core-validation.yml'
  pull_request:
    paths:
      - 'data/free-core.csv'
      - 'scripts/validate_free_core.py'
      - 'evidence/**'
      - '.github/workflows/free-core-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate free-core promotion boundary
        run: python scripts/validate_free_core.py
